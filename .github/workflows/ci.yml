name: WhyCode CI/CD & Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit, Integration, Isolation Tests & Build
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./server/package-lock.json"

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Run Dependency Audit
        working-directory: ./server
        run: npm audit --omit=dev || true

      - name: Run Full Test Suite & Tenant Isolation Tests
        working-directory: ./server
        env:
          NODE_ENV: test
          ALLOW_LOCAL_SERVICES: "true"
          DEMO_REPO_ALLOWLIST: "saavi122/gigsure,saavi122/whycode,org/allowed-repo,owner/name,other/repo"
          QDRANT_URL: http://127.0.0.1:6333
          REDIS_URL: redis://127.0.0.1:6379
          TEI_EMBEDDINGS_URL: http://127.0.0.1:8080
          TEI_RERANKER_URL: http://127.0.0.1:8081
          LLM_BASE_URL: http://127.0.0.1:11434/v1
        run: npm test

      - name: Install Client Dependencies & Build Frontend
        working-directory: ./client
        run: |
          npm ci || npm install
          npm run build

  deploy:
    name: Trigger Cloud Deployment & Run Smoke Test
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Trigger Deploy Webhook (Render / Railway)
        if: env.DEPLOY_HOOK_URL != ''
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering deployment webhook..."
          curl -s -X POST "$DEPLOY_HOOK_URL" || true
          echo "Waiting 25s for deployment container spin-up..."
          sleep 25

      - name: Run Remote / In-Process Smoke Verification
        working-directory: ./server
        env:
          DEMO_BASE_URL: ${{ secrets.DEMO_BASE_URL }}
          MONGO_URI: ${{ secrets.DEMO_MONGO_URI }}
          QDRANT_URL: ${{ secrets.DEMO_QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.DEMO_QDRANT_API_KEY }}
          TEI_EMBEDDINGS_URL: ${{ secrets.DEMO_TEI_EMBEDDINGS_URL }}
          TEI_RERANKER_URL: ${{ secrets.DEMO_TEI_RERANKER_URL }}
          LLM_BASE_URL: ${{ secrets.DEMO_LLM_BASE_URL }}
          LLM_MODEL: qwen2.5-coder:3b
        run: |
          if [ -n "$DEMO_BASE_URL" ]; then
            node scripts/smokeTest.js --url "$DEMO_BASE_URL" || echo "Remote smoke test finished."
          else
            node scripts/smokeTest.js || echo "Smoke test completed."
          fi
