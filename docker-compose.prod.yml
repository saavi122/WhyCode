version: "3.8"

services:
  # ── WhyCode Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: whycode-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
      - CLIENT_URL=${CLIENT_URL}
      - SERVER_URL=${SERVER_URL}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - TEI_EMBEDDINGS_URL=http://tei-embeddings:8080
      - TEI_RERANKER_URL=http://tei-reranker:8081
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-coder:3b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_EXTERNAL=${LLM_EXTERNAL:-false}
      - THRESHOLDS_FILE=config/thresholds.demo.json
      - DEMO_MODE=${DEMO_MODE:-true}
      - DEMO_READ_ONLY=${DEMO_READ_ONLY:-true}
      - DEMO_REPO_ALLOWLIST=${DEMO_REPO_ALLOWLIST:-saavi122/gigsure}
      - ALLOW_LOCAL_SERVICES=true
    depends_on:
      - qdrant
      - redis
      - tei-embeddings
      - tei-reranker

  # ── Qdrant Vector Database ────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: whycode-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}

  # ── Redis Cache & Queue ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: whycode-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  # ── HuggingFace TEI Embeddings (CPU) ──────────────────────────────────────────
  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: whycode-tei-embed
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - tei_embed_data:/data
    command: --model-id BAAI/bge-small-en-v1.5 --port 8080 --api-key ${INTERNAL_SERVICE_TOKEN:-}

  # ── HuggingFace TEI Reranker (CPU) ────────────────────────────────────────────
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: whycode-tei-rerank
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - tei_rerank_data:/data
    command: --model-id BAAI/bge-reranker-base --port 8081 --api-key ${INTERNAL_SERVICE_TOKEN:-}

volumes:
  qdrant_data:
  redis_data:
  tei_embed_data:
  tei_rerank_data:
